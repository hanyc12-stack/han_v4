name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files
        run: find . -maxdepth 3 -not -path './.git/*' | head -60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          echo "settings.gradle 위치: $F"
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryAlert-APK
          path: '**/app-debug.apk'
